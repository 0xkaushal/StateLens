[project]
name = "statelens-sdk"
version = "0.1.0"
description = "LangGraph instrumentation SDK for StateLens — Chrome DevTools for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
