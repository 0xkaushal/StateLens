[project]
name = "statelens"
version = "0.1.0"
description = "Chrome DevTools for AI Agents — one install, full debugging experience"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
statelens = "statelens_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk/src/statelens", "backend/src/statelens_server"]

[tool.hatch.build.targets.wheel.force-include]
"backend/src/statelens_server/static" = "statelens_server/static"

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "backend/tests"]
asyncio_mode = "auto"
pythonpath = ["sdk/src", "backend/src"]
