[project]
name = "statelens-server"
version = "0.1.0"
description = "StateLens backend server — serves LangGraph debugging data via REST API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[project.scripts]
statelens-server = "statelens_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statelens_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
